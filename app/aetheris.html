<style>
/* Hide scrollbars everywhere (still scrollable, just no visible track/thumb) —
   Firefox uses scrollbar-width, Chromium/Electron use the ::-webkit- pseudo. */
*{ scrollbar-width:none; -ms-overflow-style:none; }
*::-webkit-scrollbar{ width:0; height:0; display:none; }

/* ============ TOKENS ============ */
:root{
  --bg:#14120f;
  --panel:#1c1914;
  --panel-2:#221e18;
  --line:#332d24;
  --text:#f2eee6;
  --text-dim:#9c9484;
  --accent:#e8a33d;
  --accent-2:#4fd1c5;
  --danger:#e2604f;
  --radius:10px;
  --font-head:'Oswald',sans-serif;
  --font-body:'Inter',sans-serif;
  --btn-text:#14120f;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  background-attachment:fixed;
}
body.bg-grain{
  background-image:
    radial-gradient(circle at 15% 0%, rgba(232,163,61,0.06), transparent 40%),
    repeating-linear-gradient(180deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
}
body.bg-glow{
  background-image:
    radial-gradient(circle at 12% -5%, var(--bg-glow-color, rgba(232,163,61,0.28)), transparent 55%),
    radial-gradient(circle at 100% 100%, var(--bg-glow-color-2, rgba(232,163,61,0.14)), transparent 60%);
}
body.bg-flat{ background-image:none; }
body.compact .panel{padding:12px 14px;margin-bottom:10px;}
body.compact .panel h3{margin-bottom:8px;}
body.compact .field{margin-bottom:9px;}
body.compact .main{padding:18px 24px 40px;}
body.compact .sidebar{padding:14px 10px;}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:600;letter-spacing:.02em;margin:0 0 4px;}
a{color:var(--accent);}
button{font-family:var(--font-body);cursor:pointer;}
input,select{font-family:var(--font-body);}
::selection{background:var(--accent);color:var(--btn-text);}

/* ============ SHELL ============ */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:220px;flex:0 0 220px;background:var(--panel-translucent, var(--panel));
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:20px 14px;gap:4px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:12px;padding:10px 10px 20px;margin-bottom:12px;border-bottom:1px solid var(--line);}
.brand .mark{
  width:46px;height:46px;flex:0 0 46px;
}
.brand .mark svg,.brand .mark img{display:block;width:100%;height:100%;object-fit:contain;}
.brand .mark img{animation:mark-glow 3.2s ease-in-out infinite;}
@keyframes mark-glow{
  0%,100%{filter:drop-shadow(0 0 3px rgba(232,163,61,0.3)) brightness(1);}
  50%{filter:drop-shadow(0 0 8px rgba(79,209,197,0.55)) brightness(1.12);}
}
@media (prefers-reduced-motion: reduce){
  .brand .mark img{animation:none;filter:drop-shadow(0 0 8px rgba(232,163,61,0.4));}
}
.brand .name{font-family:var(--font-head);font-size:20px;line-height:1.15;letter-spacing:.01em;}
.brand .app-version{
  font-size:10.5px;color:var(--text-dim);letter-spacing:.02em;margin-top:3px;
  display:inline-flex;align-items:center;background:var(--panel-2);
  border:1px solid var(--line);border-radius:20px;padding:2px 8px;
  cursor:pointer;transition:border-color .15s,color .15s;position:relative;isolation:isolate;
}
.brand .app-version.has-new-notes{border-color:transparent;}
.brand .app-version.has-new-notes::before{
  content:'';position:absolute;inset:-2px;border-radius:22px;padding:1.5px;pointer-events:none;z-index:-1;
  background:conic-gradient(from var(--notes-angle,0deg), transparent 0 18%, var(--accent) 25% 38%, transparent 45% 64%, var(--accent-2) 72% 84%, transparent 91% 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  filter:drop-shadow(0 0 4px var(--accent));
  animation:version-note-trace 2.8s linear infinite;
}
@property --notes-angle{syntax:'<angle>';initial-value:0deg;inherits:false;}
@keyframes version-note-trace{to{--notes-angle:360deg;}}
@media (prefers-reduced-motion:reduce){.brand .app-version.has-new-notes::before{animation:none;}}
.brand .app-version:hover{border-color:var(--accent);color:var(--accent);}
.brand .sub{font-size:11px;color:var(--text-dim);letter-spacing:.04em;}
.navbtn{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
  background:transparent;border:1px solid transparent;color:var(--text-dim);
  font-size:14px;text-align:left;transition:background .15s,color .15s;
}
.navbtn:hover{background:var(--panel-2);color:var(--text);}
.navbtn.active{background:var(--panel-2);color:var(--text);border-color:var(--line);}
.navbtn .dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:0 0 7px;}
.navbtn.active .dot{background:var(--accent);}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:13px;color:var(--text-dim);}
.status-row{display:flex;align-items:center;gap:9px;padding:5px 0;}
.status-led{width:11px;height:11px;border-radius:50%;background:#e2604f;box-shadow:0 0 6px rgba(226,96,79,0.45);flex:0 0 11px;}
.status-led.live{background:#3ddc84;box-shadow:0 0 8px rgba(61,220,132,0.6);}
.conn-status-grid{display:flex;flex-wrap:wrap;gap:10px;}
.conn-status-item{display:flex;align-items:center;gap:9px;padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px;flex:1 1 160px;}
.conn-status-item .txt{display:flex;flex-direction:column;}
.conn-status-item .txt .label{font-weight:600;}
.conn-status-item .txt .state{font-size:11.5px;color:var(--text-dim);}

.main{flex:1;padding:28px 40px 60px;max-width:1600px;width:100%;}
.panel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:16px;align-items:start;}
.panel-grid .panel{margin-bottom:0;}
.dashboard-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start;}
.dashboard-column{display:flex;flex-direction:column;gap:16px;min-width:0;}
.dashboard-column .panel{margin-bottom:0;}
@media(max-width:980px){.dashboard-columns{grid-template-columns:1fr;}}
.span-full{grid-column:1/-1;}
.var-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:8px 20px;}
.var-row{display:flex;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);}
.var-row code{color:var(--accent);flex:0 0 auto;font-size:12.5px;}
.var-row span{color:var(--text-dim);font-size:12.5px;}
.view{display:none;}
.view.active{display:block;}
.pagehead{margin-bottom:22px;}
.pagehead p{color:var(--text-dim);font-size:13.5px;margin:2px 0 0;max-width:640px;}

.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:16px;
}
.panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin-bottom:14px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:820px){.grid2{grid-template-columns:1fr;}}

label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:5px;}
.field{margin-bottom:14px;}
input[type=text],input[type=number],input[type=password],select{
  width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
  padding:9px 11px;border-radius:7px;font-size:13.5px;outline:none;
}
input[type=text]:focus,input[type=number]:focus,input[type=password]:focus,select:focus{border-color:var(--accent);}
.help{font-size:11.5px;color:var(--text-dim);margin-top:5px;line-height:1.5;}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.ytmd-connection-row{flex-wrap:nowrap;}
.ytmd-connection-row #ytmd-status{white-space:nowrap;flex:0 0 auto;}

.btn{
  background:var(--accent);color:var(--btn-text);border:none;border-radius:7px;
  padding:9px 16px;font-size:13.5px;font-weight:600;transition:filter .15s,transform .1s;
}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:scale(.98);}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn.danger{background:var(--danger);color:#1a1210;}
.btn.small{padding:6px 11px;font-size:12px;}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--text-dim);}
.pill.on{border-color:var(--accent-2);color:var(--accent-2);}

/* ---- dashboard ---- */
.readiness-banner{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;margin-bottom:14px;border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(135deg,color-mix(in srgb,var(--panel) 92%,var(--accent) 8%),var(--panel));}
.readiness-main{display:flex;align-items:center;gap:11px;min-width:0;}
.readiness-dot{width:10px;height:10px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 4px color-mix(in srgb,var(--danger) 14%,transparent);flex:0 0 auto;}
.readiness-banner.ready{border-color:color-mix(in srgb,var(--accent-2) 55%,var(--line));}
.readiness-banner.ready .readiness-dot{background:var(--accent-2);box-shadow:0 0 14px color-mix(in srgb,var(--accent-2) 65%,transparent),0 0 0 4px color-mix(in srgb,var(--accent-2) 14%,transparent);}
.readiness-title{font-size:14px;font-weight:700;}
.readiness-sub{font-size:11.5px;color:var(--text-dim);margin-top:2px;white-space:normal;}
.readiness-services{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;}
.service-chip{font-size:11px;padding:4px 8px;border:1px solid var(--line);border-radius:99px;color:var(--text-dim);}
.service-chip.live{border-color:color-mix(in srgb,var(--accent-2) 55%,var(--line));color:var(--accent-2);}
.session-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px;}
.session-stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;min-width:0;}
.session-stat .value{font-size:20px;font-weight:750;line-height:1.1;font-variant-numeric:tabular-nums;}
.session-stat .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);margin-top:5px;}
.playback-controls{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line);}
.playback-controls .btn{min-width:42px;padding:8px 12px;background:rgba(126,132,140,.16);border:1px solid rgba(180,185,192,.28);color:rgba(224,227,231,.88);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 4px 14px rgba(0,0,0,.10);backdrop-filter:blur(12px) saturate(.8);-webkit-backdrop-filter:blur(12px) saturate(.8);display:inline-flex;align-items:center;justify-content:center;gap:7px;}
.playback-controls .btn:hover{background:rgba(145,150,158,.22);border-color:rgba(202,206,211,.38);color:rgba(242,244,246,.96);filter:none;}
.playback-controls .btn:active{background:rgba(110,115,122,.28);}
.playback-controls .play-main{min-width:86px;background:rgba(138,144,152,.22);border-color:rgba(208,212,217,.36);color:rgba(232,234,237,.92);}
.playback-controls .play-main.media-flash{transform:scale(.965);filter:brightness(1.13);}
.playback-controls .media-icon{width:15px;height:15px;display:block;flex:0 0 15px;color:currentColor;opacity:.9;}
.playback-controls .media-label{line-height:1;}
.auto-request-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);}
.auto-request-copy{min-width:0;}
.auto-request-copy strong{font-size:13px;}
.auto-request-copy div{font-size:11.5px;color:var(--text-dim);margin-top:3px;line-height:1.45;}
.auto-toggle{white-space:nowrap;}
.auto-toggle.on{border-color:var(--accent-2);color:var(--accent-2);box-shadow:0 0 14px color-mix(in srgb,var(--accent-2) 18%,transparent);}
@media(max-width:980px){.session-stats{grid-template-columns:repeat(3,1fr)}.readiness-banner{align-items:flex-start;flex-direction:column}.readiness-services{justify-content:flex-start}}
@media(max-width:620px){.session-stats{grid-template-columns:repeat(2,1fr)}}
.nowplaying{display:flex;gap:14px;align-items:center;}
.nowplaying img{width:70px;height:70px;border-radius:8px;object-fit:cover;background:#000;border:1px solid var(--line);flex:0 0 70px;}
#view-dashboard .panel.now-playing-panel{padding-top:13px;padding-bottom:13px;}
#view-dashboard .panel.now-playing-panel h3{margin-bottom:9px;}
#view-dashboard .now-playing-panel .progress-track{margin-top:8px;}
#view-dashboard .now-playing-panel .playback-controls{margin-top:9px;padding-top:9px;}
.service-command-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
.service-command-card{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:16px;}
.service-command-card.disabled{opacity:.58;}
.command-preset{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);}
.command-preset:last-child{border-bottom:none;}
.command-preset .meta{min-width:0;}
.command-preset .meta b{font-size:13px;display:block;}
.command-preset .meta span{font-size:11.5px;color:var(--text-dim);}
@media(max-width:850px){.service-command-grid{grid-template-columns:1fr;}}
.np-info{flex:1;min-width:0;}
.np-title{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.np-artist{font-size:13px;color:var(--text-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.progress-track{height:6px;border-radius:4px;background:var(--line);margin-top:12px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);width:0%;transition:width .5s linear;}
.np-time{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);margin-top:4px;font-variant-numeric:tabular-nums;}
.np-empty{color:var(--text-dim);font-size:13.5px;padding:20px 0;text-align:center;}

.queue-item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);}
.queue-item:last-child{border-bottom:none;}
.queue-item .who{font-weight:600;font-size:13px;color:var(--accent);flex:0 0 auto;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.queue-item .what{flex:1;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.queue-item .when{font-size:11px;color:var(--text-dim);flex:0 0 auto;}
.queue-actions{display:flex;gap:6px;flex:0 0 auto;}
.empty-state{color:var(--text-dim);font-size:13px;text-align:center;padding:26px 10px;}

.search-row{display:flex;gap:8px;}
.search-row input{flex:1;}
.search-results{margin-top:10px;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto;}
.search-result{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:7px;}
.search-result img{width:38px;height:38px;border-radius:5px;object-fit:cover;flex:0 0 38px;background:#000;}
.search-result .meta{flex:1;min-width:0;}
.search-result .meta .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.search-result .meta .a{font-size:11.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.tablist{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line);}
.tabbtn{padding:9px 14px;font-size:13px;color:var(--text-dim);background:transparent;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tabbtn.active{color:var(--text);border-color:var(--accent);}
.subview{display:none;}
.subview.active{display:block;}

.swatch-row{display:flex;gap:10px;flex-wrap:wrap;}
.swatch{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:74px;}
.swatch span{font-size:11px;color:var(--text-dim);}
.color-chip{
  width:44px;height:34px;border:1px solid var(--line);border-radius:7px;
  background:var(--chip-color,#ffffff);cursor:pointer;position:relative;padding:0;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
}
.color-chip::after{
  content:'';position:absolute;inset:0;border-radius:6px;
  background:linear-gradient(135deg,rgba(255,255,255,.08),transparent 45%,rgba(0,0,0,.08));
  pointer-events:none;
}
.color-hex{
  width:74px!important;padding:5px 6px!important;text-align:center;font-size:10.5px!important;
  font-family:'JetBrains Mono',monospace!important;
}
.aetheris-color-picker{
  position:fixed;z-index:10000;width:270px;padding:12px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.42);
}
.cp-main{display:flex;align-items:stretch;gap:10px;}
.cp-brightness-wrap{width:24px;display:flex;align-items:center;justify-content:center;}
.cp-brightness{
  writing-mode:vertical-lr;direction:rtl;appearance:none;
  width:16px;height:150px;background:transparent;cursor:pointer;
}
.cp-brightness::-webkit-slider-runnable-track{
  width:7px;border-radius:99px;
  background:linear-gradient(to top,#000,var(--brightness-color,#fff));
  border:1px solid rgba(255,255,255,.12);
}
.cp-brightness::-webkit-slider-thumb{
  appearance:none;width:16px;height:16px;border-radius:50%;
  background:#fff;border:2px solid #222;margin-left:-5px;
  box-shadow:0 0 0 1px rgba(255,255,255,.18);
}
.cp-brightness:focus{outline:none;}
.aetheris-color-picker[hidden]{display:none;}
.cp-sv{
  position:relative;width:214px;height:150px;border-radius:8px;overflow:hidden;cursor:crosshair;
  background:linear-gradient(to right,#fff,rgba(255,255,255,0)),
             linear-gradient(to top,#000,rgba(0,0,0,0)),
             hsl(var(--cp-hue,0) 100% 50%);
  border:1px solid rgba(255,255,255,.12);
}
.cp-marker{
  position:absolute;width:12px;height:12px;border:2px solid #fff;border-radius:50%;
  box-shadow:0 0 0 1px rgba(0,0,0,.75);transform:translate(-50%,-50%);pointer-events:none;
}
.cp-hue{
  width:214px;margin:10px 0 8px;appearance:none;height:12px;border-radius:99px;
  background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
  outline:none;
}
.cp-hue::-webkit-slider-thumb{
  appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;
  border:2px solid #222;cursor:pointer;
}
.cp-row{display:flex;gap:8px;align-items:center;}
.cp-preview{width:34px;height:30px;border-radius:6px;border:1px solid var(--line);flex:0 0 auto;}
.cp-input{flex:1;min-width:0;font-family:'JetBrains Mono',monospace!important;}
.cp-close{padding:7px 10px!important;}

.slider-row{margin-bottom:14px;}
.slider-row .val{float:right;color:var(--text-dim);font-size:12px;}
input[type=range]{width:100%;accent-color:var(--accent);}

.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;}
.preset-card{border:1px solid var(--line);border-radius:8px;padding:12px 10px;text-align:center;font-size:12.5px;background:var(--bg);cursor:pointer;user-select:none;}
.preset-card.selected{border-color:var(--accent);color:var(--accent);}

.toast{
  position:fixed;bottom:20px;right:20px;background:var(--panel-2);border:1px solid var(--line);
  padding:11px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.4);
  opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:999;
}
.toast.show{opacity:1;transform:translateY(0);}

/* ============ UPDATE MODAL ============ */
.update-modal-backdrop{
  position:fixed;inset:0;background:rgba(10,9,7,.62);backdrop-filter:blur(2px);
  display:none;align-items:center;justify-content:center;z-index:1200;
}
.update-modal-backdrop.show{display:flex;}
.update-modal{
  width:min(420px,90vw);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:24px 24px 20px;box-shadow:0 20px 60px rgba(0,0,0,.5);
  animation:update-modal-in .18s ease-out;
}
@keyframes update-modal-in{from{opacity:0;transform:translateY(6px) scale(.98);}to{opacity:1;transform:none;}}
.update-modal .icon-badge{
  width:44px;height:44px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;margin-bottom:14px;
}
.update-modal .icon-badge svg{width:22px;height:22px;}
.update-modal h2{font-family:var(--font-head);font-size:19px;letter-spacing:.01em;margin-bottom:8px;}
.update-modal p{font-size:13.5px;color:var(--text-dim);line-height:1.5;margin-bottom:20px;}
.update-modal p b{color:var(--text);font-weight:600;}
.update-modal .row{display:flex;gap:10px;justify-content:flex-end;}

/* ============ CHANGELOG MODAL ============ */
.changelog-modal{
  width:min(480px,90vw);max-height:78vh;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:0 20px 60px rgba(0,0,0,.5);animation:update-modal-in .18s ease-out;
}
.changelog-modal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px 14px;border-bottom:1px solid var(--line);flex:0 0 auto;
}
.changelog-modal-header h2{font-family:var(--font-head);font-size:17px;letter-spacing:.01em;}
.changelog-modal .icon-btn{
  background:transparent;border:none;color:var(--text-dim);font-size:19px;line-height:1;
  cursor:pointer;padding:3px 9px;border-radius:6px;
}
.changelog-modal .icon-btn:hover{color:var(--text);background:var(--panel-2);}
.changelog-modal-body{overflow-y:auto;padding:16px 18px 20px;}
.changelog-modal-footer{
  flex:0 0 auto;padding:12px 18px 15px;border-top:1px solid var(--line);
  font-size:12px;color:var(--text-dim);text-align:center;
}
.changelog-modal-footer a{color:var(--accent);text-decoration:none;}
.changelog-modal-footer a:hover{text-decoration:underline;}
.changelog-entry{margin-bottom:18px;}
.changelog-entry:last-child{margin-bottom:0;}
.changelog-entry-head{display:flex;align-items:baseline;gap:8px;margin-bottom:7px;flex-wrap:wrap;}
.changelog-entry-version{
  font-family:var(--font-head);font-size:12px;color:var(--accent);
  background:var(--panel-2);border:1px solid var(--line);border-radius:5px;
  padding:2px 7px;letter-spacing:.02em;flex:0 0 auto;
}
.changelog-entry-title{font-size:14px;font-weight:600;color:var(--text);}
.changelog-entry ul{margin:0;padding-left:17px;}
.changelog-entry li{font-size:12.5px;color:var(--text-dim);line-height:1.55;margin-bottom:4px;}
.changelog-entry li:last-child{margin-bottom:0;}

/* ============ OVERLAY ============ */
body.overlay-mode{background:transparent !important;margin:0;}
body.overlay-mode #app{display:block;}
#overlay-root{
  position:relative;
  width:max-content;
  padding:24px;
  box-sizing:border-box;
}
.ov-preview-root{
  position:relative;
  width:max-content;
  padding:24px;
  box-sizing:border-box;
}
.ov-widget{
  position:relative;display:inline-flex;align-items:center;
  font-family:var(--ov-font,var(--font-body));
  background:var(--ov-bg);color:var(--ov-text);
  border-radius:var(--ov-radius,14px);
  padding:var(--ov-pad,14px);
  gap:var(--ov-gap,14px);
  border:1px solid var(--ov-border, rgba(255,255,255,.08));
  width:var(--ov-width,550px);
  min-width:var(--ov-width,550px);
  max-width:var(--ov-width,550px);
  flex:0 0 var(--ov-width,550px);
  box-sizing:border-box;
  overflow:hidden;
}
.ov-backdrop{
  position:absolute;inset:-20%;z-index:0;
  background-image:var(--ov-backdrop-img);
  background-size:cover;background-position:center;
  filter:blur(26px) brightness(.45) saturate(1.3);
  transform:scale(1.15);
  animation:ov-backdrop-pan 18s ease-in-out infinite alternate;
}
@keyframes ov-backdrop-pan{
  0%{transform:scale(1.15) translate(0,0);}
  100%{transform:scale(1.3) translate(-2%,2%);}
}
.ov-widget > *{position:relative;z-index:1;}
.ov-art{width:var(--ov-art,64px);height:var(--ov-art,64px);border-radius:calc(var(--ov-radius,14px) - 6px);object-fit:cover;background:#000;flex:0 0 auto;}
.ov-art.motion-zoom{animation:ov-cover-zoom 7s ease-in-out infinite;}
@keyframes ov-cover-zoom{
  0%{transform:scale(1);}
  50%{transform:scale(1.14);}
  100%{transform:scale(1);}
}
.ov-art.motion-spin{animation:ov-cover-spin 10s linear infinite;border-radius:50% !important;}
@keyframes ov-cover-spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}
.ov-body{min-width:0;flex:1;overflow:hidden;}
.ov-marquee{overflow:hidden;white-space:nowrap;position:relative;width:100%;max-width:100%;}
.ov-marquee .inner{display:inline-flex;align-items:center;gap:40px;width:max-content;will-change:transform;transform:translateX(0);}
.ov-marquee .marquee-copy{display:inline-block;flex:0 0 auto;}
.ov-marquee .marquee-copy + .marquee-copy{display:none;}
.ov-marquee.is-scrolling .marquee-copy + .marquee-copy{display:inline-block;}
.ov-title{font-weight:700;font-size:var(--ov-titlesize,16px);}
.ov-artist{font-size:calc(var(--ov-titlesize,16px) - 3px);opacity:.75;margin-top:2px;}
.ov-progress{height:var(--ov-barheight,5px);background:rgba(255,255,255,.15);border-radius:99px;margin-top:9px;overflow:hidden;}
.ov-progress .fill{height:100%;background:var(--ov-accent,#e8a33d);width:0%;}
.ov-badge{font-size:10px;text-transform:uppercase;letter-spacing:.06em;opacity:.55;margin-top:6px;}
.ov-widget.style-compact{padding:8px 12px;border-radius:99px;}
.ov-widget.style-compact .ov-art{width:34px;height:34px;border-radius:99px;}
.ov-widget.style-neon{box-shadow:0 0 0 1px var(--ov-accent,#e8a33d), 0 0 22px -4px var(--ov-accent,#e8a33d);}
.ov-widget.style-cassette{border-radius:6px;}
.ov-widget.style-cassette .ov-art{border-radius:4px;}
.ov-hidden{display:none !important;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<div id="update-modal-backdrop" class="update-modal-backdrop">
  <div class="update-modal">
    <div class="icon-badge">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 4v9m0 0l-3.5-3.5M12 13l3.5-3.5" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5 16.5A6.5 6.5 0 0112 8" stroke="var(--accent-2)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
        <path d="M19 16.5A6.5 6.5 0 0012 8" stroke="var(--accent-2)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      </svg>
    </div>
    <h2 id="update-modal-title">Update available</h2>
