<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: blob: https:; connect-src 'self' http://127.0.0.1:*; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none';">
<title>Aetheris OBS Overlay</title>
<style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden}body{font-family:Inter,Segoe UI,Arial,sans-serif}#overlay-root{position:relative;width:max-content;padding:24px;box-sizing:border-box}.ov-widget{position:relative;display:inline-flex;align-items:center;font-family:var(--ov-font,Inter,Segoe UI,Arial,sans-serif);background:var(--ov-bg);color:var(--ov-text);border-radius:var(--ov-radius,14px);padding:var(--ov-pad,14px);gap:var(--ov-gap,14px);border:1px solid var(--ov-border,rgba(255,255,255,.08));width:var(--ov-width,550px);min-width:var(--ov-width,550px);max-width:var(--ov-width,550px);flex:0 0 var(--ov-width,550px);box-sizing:border-box;overflow:hidden}.ov-backdrop{position:absolute;inset:-20%;z-index:0;background-image:var(--ov-backdrop-img);background-size:cover;background-position:center;filter:blur(26px) brightness(.45) saturate(1.3);transform:scale(1.15);animation:ov-backdrop-pan 18s ease-in-out infinite alternate}@keyframes ov-backdrop-pan{0%{transform:scale(1.15) translate(0,0)}100%{transform:scale(1.3) translate(-2%,2%)}}.ov-widget>*{position:relative;z-index:1}.ov-art{width:var(--ov-art,64px);height:var(--ov-art,64px);border-radius:calc(var(--ov-radius,14px) - 6px);object-fit:cover;background:#000;flex:0 0 auto}.ov-art.motion-zoom{animation:ov-cover-zoom 7s ease-in-out infinite}@keyframes ov-cover-zoom{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}.ov-art.motion-spin{animation:ov-cover-spin 10s linear infinite;border-radius:50%!important}@keyframes ov-cover-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}.ov-body{min-width:0;flex:1;overflow:hidden}.ov-marquee{overflow:hidden;white-space:nowrap;position:relative;width:100%;max-width:100%}.ov-marquee .inner{display:inline-flex;align-items:center;gap:40px;width:max-content;will-change:transform;transform:translateX(0)}.ov-marquee .marquee-copy{display:inline-block;flex:0 0 auto}.ov-marquee .marquee-copy+.marquee-copy{display:none}.ov-marquee.is-scrolling .marquee-copy+.marquee-copy{display:inline-block}.ov-title{font-weight:700;font-size:var(--ov-titlesize,16px)}.ov-artist{font-size:calc(var(--ov-titlesize,16px) - 3px);opacity:.75;margin-top:2px}.ov-progress{height:var(--ov-barheight,5px);background:rgba(255,255,255,.15);border-radius:99px;margin-top:9px;overflow:hidden}.ov-progress .fill{height:100%;background:var(--ov-accent,#e8a33d);width:0}.ov-badge{font-size:10px;text-transform:uppercase;letter-spacing:.06em;opacity:.55;margin-top:6px}.ov-widget.style-compact{padding:8px 12px;border-radius:99px}.ov-widget.style-compact .ov-art{width:34px;height:34px;border-radius:99px}.ov-widget.style-neon{box-shadow:0 0 0 1px var(--ov-accent,#e8a33d),0 0 22px -4px var(--ov-accent,#e8a33d)}.ov-widget.style-cassette{border-radius:6px}.ov-widget.style-cassette .ov-art{border-radius:4px}
</style>
</head>
<body><div id="overlay-root"></div><script src="/overlay/aetheris-overlay.js"></script></body>
</html>
